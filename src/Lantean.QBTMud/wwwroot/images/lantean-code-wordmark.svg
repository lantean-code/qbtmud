<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 400" role="img" aria-labelledby="title description" style="--lantean-aqua: #22D3EE; --lantean-emerald: #10B981; --lantean-wordmark: #F5F7FA" data-font-outlined="Rubik Regular">
  <title id="title">Lantean Code</title>
  <desc id="description">Lantean Code horizontal logo with the left half of its aperture mark used as the letter C.</desc>

  <style>
    .primary { fill: var(--lantean-aqua, #22D3EE); }
    .accent { fill: var(--lantean-emerald, #10B981); }
    .name { fill: var(--lantean-wordmark, #F5F7FA); }
    .symbol-primary,
    .symbol-accent {
      stroke-width: 8;
      stroke-linejoin: miter;
      paint-order: stroke fill;
    }
    .symbol-primary {
      fill: var(--lantean-aqua, #22D3EE);
      stroke: var(--lantean-aqua, #22D3EE);
    }
    .symbol-accent {
      fill: var(--lantean-emerald, #10B981);
      stroke: var(--lantean-emerald, #10B981);
    }
  </style>

  <defs>
    <path id="aperture-diagonal" d="M 240 57 L 240 139 L 224 139 L 224 108.0267              L 120 171.92 L 84 152.84 Z" />
    <path id="aperture-side" d="M 80 174.72 L 120 195.92 L 120 316.08 L 80 337.28 Z" />
    <path id="code-bracket" d="M 224 194 L 224 224 L 188 256 L 224 288              L 224 318 L 152 256 Z" />

    <g id="mark">
      <g class="primary">
        <use href="#aperture-diagonal" />
        <use href="#aperture-diagonal" transform="translate(512 512) scale(-1 -1)" />
        <use href="#aperture-side" />
        <use href="#aperture-side" transform="translate(512 0) scale(-1 1)" />
        <use href="#code-bracket" />
        <use href="#code-bracket" transform="translate(512 0) scale(-1 1)" />
      </g>
      <g class="accent">
        <use href="#aperture-diagonal" transform="translate(512 0) scale(-1 1)" />
        <use href="#aperture-diagonal" transform="translate(0 512) scale(1 -1)" />
      </g>
    </g>

    <g id="symbol-c">
      <use class="symbol-primary" href="#aperture-diagonal" />
      <use class="symbol-primary" href="#aperture-side" />
      <use class="symbol-accent" href="#aperture-diagonal" transform="translate(0 512) scale(1 -1)" />
    </g>
  </defs>

  <use href="#mark" transform="translate(30 30) scale(0.6640625)" />

