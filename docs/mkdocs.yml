site_name: qbtmud
site_url: https://lantean-code.github.io/qbtmud/
site_description: Documentation for qbtmud, a drop-in replacement for qBittorrent's default WebUI.
repo_name: lantean-code/qbtmud
repo_url: https://github.com/lantean-code/qbtmud
docs_dir: content
site_dir: ../site
theme:
  name: material
  custom_dir: overrides
  logo: assets/images/qbtmud-icon-transparent.svg
  favicon: assets/images/qbtmud-icon-transparent-32.png
  palette:
    # Follow system preference
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
extra_css:
  - stylesheets/brand.css
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Installation: installation.md
  - Advanced setup: advanced-setup.md
  - Reverse proxy hosting: reverse-proxy.md
  - Separate API and UI hosting: separate-api-ui-hosting.md
  - Build from source: build-from-source.md
